# Only holds the test dependencies: the gateway itself is configuration, plus the recognizers baked into the
# Presidio Analyzer image (docker/presidio-analyzer/pii_recognizers) and the guardrail class mounted into LiteLLM
# (guardrails/).
# `uv run pytest` installs them in .venv from uv.lock.

[project]
name = "llmops-gateway"
version = "0.5.5"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "httpx>=0.28",
    # Same version as the LiteLLM image, whose Presidio guardrail guardrails/presidio_markers.py extends.
    "litellm==1.106.0",
    "openai>=2",
    # Publishes jobs to the job queue in tests/integration/test_worker.py.
    "pika>=1.3",
    # Same version as the Analyzer image, so the unit tests run the recognizers on the code they run on in the stack.
    "presidio-analyzer==2.2.362",
    "phonenumbers==9.0.41",
    "pytest>=8",
    "python-dotenv>=1",
    "faker==40.43.0",
    "pyyaml==6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets the unit tests import pii_recognizers from the Analyzer image's build context, presidio_markers, and the
# LiteLLM patches of the gateway's image.
pythonpath = ["docker/presidio-analyzer", "guardrails", "docker/litellm"]
addopts = "-v -ra"
markers = [
    "disruptive: stops a container of the stack; runs after every other test",
    "leak: replays the benchmark texts to prove no personal data leaks; a CI job of its own (`-m leak`)",
]
