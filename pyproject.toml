# Only holds the test dependencies: the gateway itself is configuration, plus the recognizers baked into the
# Presidio Analyzer image (docker/presidio-analyzer/pii_recognizers).
# `uv run pytest` installs them in .venv from uv.lock.

[project]
name = "llmops-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "httpx>=0.28",
    "openai>=2",
    # Same version as the Analyzer image, so the unit tests run the recognizers on the code they run on in the stack.
    "presidio-analyzer==2.2.362",
    "phonenumbers==9.0.26",
    "pytest>=8",
    "python-dotenv>=1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets the unit tests import pii_recognizers from the Analyzer image's build context.
pythonpath = ["docker/presidio-analyzer"]
addopts = "-v -ra"
markers = [
    "disruptive: stops a container of the stack; runs after every other test",
]
