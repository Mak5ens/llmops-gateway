name: CI

on:
  pull_request:
    # `edited` re-checks the PR title when it is renamed.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.15"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      # gitleaks only scans staged changes as a hook; the job below scans the full history.
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit-tests:
    # The Presidio recognizers and the guardrail class against their test cases, without the stack: fails in seconds, not minutes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: just test-unit

  gateway-integration:
    # Starts the whole stack on a clean runner, then runs the pytest suite: every alias, access per team,
    # rate limit, budget, the chat-large fallback and Presidio. Breaking any of these in config/ turns the job red.
    runs-on: ubuntu-latest
    # Acceptance criterion of LAB-112: the job stays under 10 minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      # A step of its own, so its duration (model download included) shows apart from the tests.
      - run: just gateway-up
      # The leak tests run in the job below, on a stack of their own.
      - run: just test -m "not leak"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: just gateway-down --volumes

  no-leak:
    # Replays the 100 annotated texts of the benchmark through the gateway: only the words Presidio is known to miss
    # may reach the model, and no personal data the traces or the logs (tests/integration/test_no_leak.py).
    # A job of its own, in parallel: its 100 real model calls would bring gateway-integration close to its limit.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: just gateway-up
      - run: just test -m leak
      - if: failure()
        run: docker compose logs
      - if: always()
        run: just gateway-down --volumes

  pr-title:
    # PRs are squash-merged, so the PR title becomes the Conventional Commit on main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
