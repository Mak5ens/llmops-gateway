name: CI

on:
  pull_request:
    # `edited` re-checks the PR title when it is renamed.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      # gitleaks only scans staged changes as a hook; the job below scans the full history.
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gateway-integration:
    # Starts the whole stack on a clean runner, then runs the pytest suite: every alias, access per team,
    # rate limit, budget, and the chat-large fallback. Breaking any of these in config/ turns the job red.
    runs-on: ubuntu-latest
    # Acceptance criterion of LAB-112: the job stays under 10 minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: extractions/setup-just@v4
      # A step of its own, so its duration (model download included) shows apart from the tests.
      - run: just gateway-up
      - run: just test
      - if: failure()
        run: docker compose logs
      - if: always()
        run: just gateway-down --volumes

  pr-title:
    # PRs are squash-merged, so the PR title becomes the Conventional Commit on main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
