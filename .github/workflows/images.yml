name: Images

# Images the platform deploys (llmops-platform): built on every PR, published to GHCR from main,
# tagged with the commit (sha-<7 characters>).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  image:
    name: image (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # French Presidio Analyzer: spaCy fr_core_news_lg, the French recognizers and their configuration.
          - name: presidio-analyzer
            context: docker/presidio-analyzer
            build-contexts: |
              config=config/presidio
          # LiteLLM with the pii-fr guardrail class and the tenant bootstrap scripts.
          - name: litellm
            context: docker/litellm
            build-contexts: |
              guardrails=guardrails
              scripts=scripts
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/mak5ens/llmops-gateway/${{ matrix.name }}
          tags: type=sha,prefix=sha-
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          build-contexts: ${{ matrix.build-contexts }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
