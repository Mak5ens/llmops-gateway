name: Images

# Images the platform deploys (llmops-platform), built by its shared workflow (ADR-022 in llmops-platform): Trivy scan
# that blocks critical CVEs with a fix, then from main, publication to GHCR as sha-<7 characters>, SBOM (Syft) and
# keyless signature (cosign), both verifiable with `cosign verify` (README, "Images").
# The workflow is pinned to a commit of llmops-platform; Renovate proposes the updates.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # French Presidio Analyzer: spaCy fr_core_news_lg, the French recognizers and their configuration.
  presidio-analyzer:
    uses: Mak5ens/llmops-platform/.github/workflows/build-image.yml@536f10bc161d6c9b953a3338851c7046461d5079
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      image: ghcr.io/mak5ens/llmops-gateway/presidio-analyzer
      context: docker/presidio-analyzer
      build-contexts: |
        config=config/presidio
      push: ${{ github.event_name == 'push' }}

  # LiteLLM with the pii-fr guardrail class and the tenant bootstrap scripts.
  litellm:
    uses: Mak5ens/llmops-platform/.github/workflows/build-image.yml@536f10bc161d6c9b953a3338851c7046461d5079
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      image: ghcr.io/mak5ens/llmops-gateway/litellm
      context: docker/litellm
      build-contexts: |
        guardrails=guardrails
        scripts=scripts
      push: ${{ github.event_name == 'push' }}
