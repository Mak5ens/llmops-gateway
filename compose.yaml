# Local gateway stack: LiteLLM Proxy in front of Ollama, with PostgreSQL for keys and spend
# and Presidio to detect and anonymize personal data. Langfuse, which traces the calls, is in compose.langfuse.yaml.
# Start with `just gateway-up`, stop with `just gateway-down`. Settings come from `.env` (see `.env.example`).

name: llmops-gateway

include:
  - compose.langfuse.yaml

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/<major>/, so mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Serves chat-small and embed. Each Ollama instance stands for one model server, like vLLM pods on the cluster.
  ollama:
    image: ollama/ollama:0.40.2
    volumes:
      - ollama-models:/root/.ollama
    ports:
      # For the benchmark, which queries models without the gateway (benchmarks/run_bench.py).
      - 127.0.0.1:${OLLAMA_PORT:-11435}:11434
    healthcheck: &ollama-healthcheck
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Serves chat-large. Stopping it simulates an outage of the main model: `tests/integration/test_fallback.py`.
  ollama-large:
    image: ollama/ollama:0.40.2
    volumes:
      - ollama-models:/root/.ollama
    healthcheck: *ollama-healthcheck
    restart: unless-stopped

  # One-shot job: downloads every model on first start, then exits. Later starts only check the manifests.
  # Both Ollama instances share the model volume, so pulling through one is enough.
  ollama-pull:
    image: ollama/ollama:0.40.2
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODELS_TO_PULL: ${OLLAMA_MODELS:?set in .env}
    entrypoint: ["sh", "-c", "for m in $$OLLAMA_MODELS_TO_PULL; do ollama pull $$m || exit 1; done"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  litellm:
    image: ghcr.io/berriai/litellm-database:v1.104.2
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set in .env}
      # INFO shows retries, fallbacks and cooldowns in the logs.
      LITELLM_LOG: INFO
      # Traces go to Langfuse (callbacks in config/litellm.yaml): to the Gateway project with these keys, and to the
      # team's own project for a team key, with the team's secret key below (config/tenants.yaml).
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_SECRET_KEY_F1: ${LANGFUSE_SECRET_KEY_F1:?set in .env}
      LANGFUSE_SECRET_KEY_MJ: ${LANGFUSE_SECRET_KEY_MJ:?set in .env}
      LANGFUSE_SECRET_KEY_BAUX: ${LANGFUSE_SECRET_KEY_BAUX:?set in .env}
      LANGFUSE_SECRET_KEY_SUPPORT: ${LANGFUSE_SECRET_KEY_SUPPORT:?set in .env}
    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro
      # Custom guardrail classes are loaded from the directory of the config file.
      - ./guardrails/presidio_markers.py:/app/presidio_markers.py:ro
    ports:
      - 127.0.0.1:${LITELLM_PORT:-4000}:4000
    depends_on:
      postgres:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
      # The pii-fr guardrail calls both on every request of a team that has not opted out.
      presidio-analyzer:
        condition: service_healthy
      presidio-anonymizer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Detects personal data (names, places, emails, phone numbers...) in a text and returns their positions.
  # Built from the official image plus the French spaCy model: docker/presidio-analyzer/Dockerfile.
  presidio-analyzer:
    build:
      context: docker/presidio-analyzer
      additional_contexts:
        config: config/presidio
    image: llmops-gateway/presidio-analyzer:2.2.362-fr
    environment:
      # Gunicorn 25.1.0 starts a control socket thread, then forks the worker: the worker can inherit a held
      # logging lock and hang forever before "Booting worker" (gunicorn issue #3529). Seen in CI; we never
      # use the control socket.
      GUNICORN_CMD_ARGS: --no-control-socket
      ANALYZER_CONF_FILE: /config/analyzer.yaml
      NLP_CONF_FILE: /config/nlp.yaml
      RECOGNIZER_REGISTRY_CONF_FILE: /config/recognizers.yaml
    volumes:
      - ./config/presidio:/config:ro
    # Measured at 1.6 GiB with the French and English models loaded (1.0 GiB with French only).
    mem_limit: 2g
    ports:
      - 127.0.0.1:${PRESIDIO_ANALYZER_PORT:-5002}:3000
    healthcheck: &presidio-healthcheck
      # The image's own check runs every 30 s, which slows down `docker compose up --wait`.
      test: ["CMD", "curl", "-fs", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      # Loading both spaCy models takes a while.
      start_period: 30s
    restart: unless-stopped

  # Replaces, masks or encrypts the spans found by the Analyzer. Stateless, no model.
  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:2.2.362
    environment:
      # Same gunicorn 25.1.0 hang as the Analyzer.
      GUNICORN_CMD_ARGS: --no-control-socket
    ports:
      - 127.0.0.1:${PRESIDIO_ANONYMIZER_PORT:-5001}:3000
    healthcheck: *presidio-healthcheck
    restart: unless-stopped

  # One-shot job: creates or updates the client teams and their keys from config/tenants.yaml, then exits.
  # Reuses the LiteLLM image, which already has Python and PyYAML.
  # Run by `just gateway-up` and `just tenants` with `docker compose run`. The profile keeps it out of
  # `docker compose up --wait`, which fails on any container that exits, even with code 0, when nothing depends on it.
  tenants-bootstrap:
    image: ghcr.io/berriai/litellm-database:v1.104.2
    profiles: [bootstrap]
    entrypoint: ["python3", "/scripts/bootstrap_tenants.py"]
    environment:
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      TENANTS_FILE: /config/tenants.yaml
      TEAM_KEY_F1: ${TEAM_KEY_F1:?set in .env}
      TEAM_KEY_MJ: ${TEAM_KEY_MJ:?set in .env}
      TEAM_KEY_BAUX: ${TEAM_KEY_BAUX:?set in .env}
      TEAM_KEY_SUPPORT: ${TEAM_KEY_SUPPORT:?set in .env}
      # Langfuse organizations, projects and accounts of the teams: scripts/bootstrap_langfuse.py.
      LANGFUSE_URL: http://langfuse-web:3000
      LANGFUSE_DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD}@langfuse-postgres:5432/langfuse
      LANGFUSE_SALT: ${LANGFUSE_SALT}
      LANGFUSE_ADMIN_EMAIL: ${LANGFUSE_ADMIN_EMAIL}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_SECRET_KEY_F1: ${LANGFUSE_SECRET_KEY_F1}
      LANGFUSE_SECRET_KEY_MJ: ${LANGFUSE_SECRET_KEY_MJ}
      LANGFUSE_SECRET_KEY_BAUX: ${LANGFUSE_SECRET_KEY_BAUX}
      LANGFUSE_SECRET_KEY_SUPPORT: ${LANGFUSE_SECRET_KEY_SUPPORT}
      LANGFUSE_VIEWER_PASSWORD_F1: ${LANGFUSE_VIEWER_PASSWORD_F1:?set in .env}
      LANGFUSE_VIEWER_PASSWORD_MJ: ${LANGFUSE_VIEWER_PASSWORD_MJ:?set in .env}
      LANGFUSE_VIEWER_PASSWORD_BAUX: ${LANGFUSE_VIEWER_PASSWORD_BAUX:?set in .env}
      LANGFUSE_VIEWER_PASSWORD_SUPPORT: ${LANGFUSE_VIEWER_PASSWORD_SUPPORT:?set in .env}
      LITELLM_CONFIG: /config/litellm.yaml
    volumes:
      - ./config/tenants.yaml:/config/tenants.yaml:ro
      - ./config/litellm.yaml:/config/litellm.yaml:ro
      - ./scripts/bootstrap_tenants.py:/scripts/bootstrap_tenants.py:ro
      - ./scripts/bootstrap_langfuse.py:/scripts/bootstrap_langfuse.py:ro
    depends_on:
      litellm:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
  ollama-models:
